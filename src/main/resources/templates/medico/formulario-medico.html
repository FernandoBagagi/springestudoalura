<!DOCTYPE html>
<html lang="pt"
      xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template.html}">
<head>
    <title>Cadastro de Médicos</title>
</head>

<body>
    <div layout:fragment="conteudo">
        <main class="container">
            <section class="card form-card">
                <h2 class="title">Cadastro de médico</h2>

                <form method="post" action="#" th:action="@{/web/medicos}" th:object="${dados}">
                    <input type="hidden" name="id" th:field="*{id}">

                    <div class="form-group">
                        <label for="usuarioEmail">Email:</label>
                        <input id="usuarioEmail" name="usuarioEmail" th:field="*{usuarioEmail}" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('usuarioEmail')}" th:errors="*{usuarioEmail}"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="usuarioLogin">Login:</label>
                        <input id="usuarioLogin" name="usuarioLogin" th:field="*{usuarioLogin}" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('usuarioLogin')}" th:errors="*{usuarioLogin}"></div>
                    </div>

                    <div class="form-group" th:unless="${cadastro}">
                        <label for="senhaAntiga">Senha Antiga:</label>
                        <input id="senhaAntiga" name="senhaAntiga" th:field="*{senhaAntiga}">
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('senhaAntiga')}" th:errors="*{senhaAntiga}"></div>
                    </div>

                    <div class="form-group" th:unless="${cadastro}">
                        <label for="senhaNova">Senha Nova:</label>
                        <input id="senhaNova" name="senhaNova" th:field="*{senhaNova}">
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('senhaNova')}" th:errors="*{senhaNova}"></div>
                    </div>

                    <div class="form-group">
                        <label for="genero">Gênero</label>
                        <select id="genero" name="genero" required th:field="*{genero}">
                            <option th:value="${null}">Selecione uma especialidade</option>
                            <option th:each="genero : ${generos}" th:value="${genero}" th:text="${genero}" th:selected="${dados.genero == genero}"></option>
                        </select>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></div>
                    </div>

                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input id="nome" name="nome" th:field="*{nome}" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>

                    <div class="form-group">
                        <label for="sobrenome">Sobrenome:</label>
                        <input id="sobrenome" name="sobrenome" th:field="*{sobrenome}" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('sobrenome')}" th:errors="*{sobrenome}"></div>
                    </div>

                    <div class="form-group">
                        <label for="crm">CRM:</label>
                        <input id="crm" name="crm" th:field="*{crm}" required>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('crm')}" th:errors="*{crm}"></div>
                    </div>

                    <div class="form-group">
                        <label for="especialidade">Especialidade</label>
                        <select id="especialidade" name="especialidade" th:field="*{especialidade}" required>
                            <option th:value="${null}">Selecione uma especialidade</option>
                            <option th:each="especialidade : ${especialidades}" th:value="${especialidade}" th:text="${especialidade}" th:selected="${dados.especialidade == especialidade}"></option>
                        </select>
                        <div class="alert alert-danger" th:if="${#fields.hasErrors('especialidade')}" th:errors="*{especialidade}"></div>
                    </div>

                    <div class="buttons">
                        <button type="submit" class="btn btn-primary" th:text="${dados.isCadastro() ? 'Cadastrar' : 'Salvar alterações'}">
                            <img src="/static/web/assets/plus.png" th:src="@{/web/assets/plus.png}" alt="Ícone de adicionar" class="btn-icon">
                        </button>

                        <a href="listagem-medicos.html" th:href="@{/web/medicos}" class="btn btn-secondary">
                            <img src="/static/web/assets/back.png" th:src="@{/web/assets/back.png}" alt="Voltar" class="btn-icon">Voltar
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
